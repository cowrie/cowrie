# Filebeat configuration that ships Cowrie's JSON log to Logstash.
# Full reference: https://www.elastic.co/docs/reference/beats/filebeat

filebeat.inputs:
- type: filestream
  id: cowrie
  enabled: true
  # Point this at your Cowrie state directory
  paths:
    - /home/cowrie/my-honeypot/var/log/cowrie/cowrie.json*

output.logstash:
  enabled: true
  # The Logstash hosts
  hosts: ["localhost:5044"]

  # Optional TLS. Off by default.
  # List of root certificates for server verification
  #ssl.certificate_authorities: ["/etc/pki/root/ca.pem"]

  # Certificate for TLS client authentication
  #ssl.certificate: "/etc/pki/client/cert.pem"

  # Client certificate key
  #ssl.key: "/etc/pki/client/cert.key"
